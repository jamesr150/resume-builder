<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Resume Builder</title>

  <!-- Font: Inter for clean UI -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Link to your updated stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme">

  <div class="resume-container animate-fade-in">

    <!-- Title -->
    <h1 class="glow-text">Build Your Resume</h1>
    <p class="ai-credit">⚡ Powered by AI</p>

    <!-- Resume Form -->
    <form method="POST" action="/resume">

      <!-- Contact Info -->
      <h3>Contact Info</h3>
      <label>Name:</label>
      <input type="text" name="name" placeholder="e.g., James Rooney">

      <label>Email:</label>
      <input type="email" name="email" placeholder="e.g., James@email.com">

      <label>LinkedIn URL:</label>
      <input type="text" name="linkedin" placeholder="https://linkedin.com/in/yourprofile">

      <!-- Job Info -->
      <h3>Professional Info</h3>
      <label>Job Title:</label>
      <input type="text" name="job_title" placeholder="e.g., Software Engineer">

      <label>Work Experience:</label>
      <textarea name="experience" rows="5" placeholder="Describe your past roles..."></textarea>

      <label>Education:</label>
      <textarea name="education" rows="3" placeholder="Schools, degrees..."></textarea>

      <!-- Summary -->
      <h3>Summary</h3>
      <label>Summary:</label>
      <textarea name="summary" rows="4" placeholder="Write a brief personal summary..."></textarea>

      <!-- Skills -->
      <h3>Skills</h3>
      <label>Skills (comma separated):</label>
      <input type="text" name="skills" placeholder="Python, Flask, SQL, Communication">

      <!-- Submit -->
      <input type="submit" value="Generate Resume" class="submit-btn pulse-btn">
    </form>
  </div>
</body>
</html>
