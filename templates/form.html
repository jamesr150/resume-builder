<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <title>Resume Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="resume-container">
    <h1>Build Your Resume</h1>
    <p class="ai-credit">Powered by AI</p>

    <form method="POST" action="/resume">
      <h3>Contact Info</h3>
      <label>Name:</label>
      <input type="text" name="name" placeholder="e.g., James Rooney">

      <label>Email:</label>
      <input type="email" name="email" placeholder="e.g., James@email.com">

      <label>LinkedIn URL:</label>
      <input type="text" name="linkedin" placeholder="https://linkedin.com/in/yourprofile">

      <h3>Professional Info</h3>
      <label>Job Title:</label>
      <input type="text" name="job_title" placeholder="e.g., Software Engineer">

      <label>Work Experience:</label>
      <textarea name="experience" rows="5" placeholder="Describe your past roles..."></textarea>

      <h3>Summary</h3>
      <label>Summary:</label>
      <textarea name="summary" rows="4" placeholder="Write a brief personal summary..."></textarea>
      <button id="ai-summary-btn" type="button" class="ai-btn" onclick="generateSummary()">Generate Summary with AI</button>

      <h3>Education</h3>
      <textarea name="education" rows="3" placeholder="Schools, degrees..."></textarea>

      <h3>Skills</h3>
      <label>Skills (comma separated):</label>
      <input type="text" name="skills" placeholder="Python, Flask, SQL, Communication">

      <input type="submit" value="Generate Resume">
    </form>
  </div>

  <script>
    const summaryBox = document.querySelector('textarea[name="summary"]');

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // Auto-resize as user types
    summaryBox.addEventListener('input', () => autoResizeTextarea(summaryBox));

    // Generate AI summary and auto-expand the box
    async function generateSummary() {
      const button = document.getElementById("ai-summary-btn");
      const jobTitle = document.querySelector('input[name="job_title"]').value;
      const experience = document.querySelector('textarea[name="experience"]').value;

      if (!jobTitle || !experience) {
        alert("Please fill in job title and experience before generating a summary.");
        return;
      }

      button.disabled = true;
      button.textContent = "Generating...";

      try {
        const response = await fetch('/generate-summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ job_title: jobTitle, experience: experience })
        });

        const data = await response.json();
        if (data.summary) {
          summaryBox.value = data.summary;
          autoResizeTextarea(summaryBox);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (error) {
        alert("Something went wrong. Please try again later.");
      } finally {
        button.disabled = false;
        button.textContent = "Generate Summary with AI";
      }
    }
  </script>
</body>
</html>
