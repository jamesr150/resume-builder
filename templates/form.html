<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</script>
</head>
<body>
  <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
    <i id="themeIcon" class="fas fa-moon"></i>
  </button>
  
  
  
  <div class="resume-container" id="resume-content">
    <h1>Build Your Resume</h1>
    <p class="ai-credit">Powered by AI</p>

    <form method="POST" action="/resume">
      <div id="spinner" class="spinner-overlay hidden">
        <div class="spinner"></div>
      </div>      
      <h3>Contact Info</h3>
      <label>Name:</label>
      <input type="text" name="name" placeholder="e.g., James Rooney" />

      <label>Email:</label>
      <input type="email" name="email" placeholder="e.g., James@email.com" />

      <label>LinkedIn URL:</label>
      <input type="text" name="linkedin" placeholder="https://linkedin.com/in/yourprofile" />

      <h3>Professional Info</h3>
      <label>Job Title:</label>
      <input type="text" name="job_title" placeholder="e.g., Software Engineer" />

      <label>Work Experience:</label>
      <textarea name="experience" rows="5" placeholder="Describe your past roles..."></textarea>

      <h3>Summary</h3>
      <label>Summary:</label>
      <textarea name="summary" rows="4" placeholder="Write a brief personal summary..."></textarea>
      <button id="ai-summary-btn" type="button" class="btn ai-btn" onclick="generateSummary()">Generate Summary with AI</button>

      <h3>Education</h3>
      <textarea name="education" rows="3" placeholder="Schools, degrees..."></textarea>

      <h3>Skills</h3>
      <label>Skills (comma separated):</label>
      <input type="text" name="skills" placeholder="Python, Flask, SQL, Communication" />

      <input type="submit" class="btn download-btn pulse-btn" value="Generate Resume" />
      <button type="button" class="btn clear-btn" onclick="clearForm()">Clear Form</button>
    </form>
  </div>

  <script>
    const summaryBox = document.querySelector('textarea[name="summary"]');

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    summaryBox.addEventListener('input', () => autoResizeTextarea(summaryBox));

    async function generateSummary() {
  const button = document.getElementById("ai-summary-btn");
  const jobTitle = document.querySelector('input[name="job_title"]').value;
  const experience = document.querySelector('textarea[name="experience"]').value;
  const spinner = document.getElementById("spinner");

  if (!jobTitle || !experience) {
    alert("Please fill in job title and experience before generating a summary.");
    return;
  }

  button.disabled = true;
  button.textContent = "Generating...";
  spinner.classList.remove("hidden");

  try {
    const response = await fetch('/generate-summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_title: jobTitle, experience: experience })
    });

    const data = await response.json();
    if (data.summary) {
      const summaryBox = document.querySelector('textarea[name="summary"]');
      summaryBox.value = data.summary;
      autoResizeTextarea(summaryBox);
    } else {
      alert('Error: ' + data.error);
    }
  } catch (error) {
    alert("Something went wrong. Please try again later.");
  } finally {
    button.disabled = false;
    button.textContent = "Generate Summary with AI";
    spinner.classList.add("hidden");
  }
}
  </script>
  <script>
    // Save form data on submit
    document.querySelector("form").addEventListener("submit", () => {
      const formData = {
        name: document.querySelector('input[name="name"]').value,
        email: document.querySelector('input[name="email"]').value,
        linkedin: document.querySelector('input[name="linkedin"]').value,
        job_title: document.querySelector('input[name="job_title"]').value,
        experience: document.querySelector('textarea[name="experience"]').value,
        summary: document.querySelector('textarea[name="summary"]').value,
        education: document.querySelector('textarea[name="education"]').value,
        skills: document.querySelector('input[name="skills"]').value
      };
      localStorage.setItem('resumeFormData', JSON.stringify(formData));
    });
  
    // Repopulate form if data exists
    window.addEventListener("DOMContentLoaded", () => {
      const savedData = JSON.parse(localStorage.getItem('resumeFormData') || '{}');
      for (const key in savedData) {
        const el = document.querySelector(`[name="${key}"]`);
        if (el) el.value = savedData[key];
      }
    });
  </script>
  <script>
    function clearForm() {
      // Clear form inputs
      document.querySelector("form").reset();
      
      // Clear localStorage
      localStorage.removeItem("resumeFormData");
  
      // Also reset any manually set values (like textareas with auto-resize)
      const textareas = document.querySelectorAll("textarea");
      textareas.forEach(el => el.style.height = "auto");
    }
  </script>
  
  <footer class="app-footer">
    <p>
      Built by <strong>James Rooney</strong> ·
      <a href="https://github.com/jamesr150/resume-builder" target="_blank">
        View on GitHub
      </a>
    </p>
  </footer>  
  <script>
    const themeSwitcher = document.getElementById('themeSwitcher');
  
    // Apply saved theme on load
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light-mode');
        if (themeSwitcher) themeSwitcher.checked = true;
      }
    });
  
    // Toggle and persist theme
    if (themeSwitcher) {
      themeSwitcher.addEventListener('change', () => {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
      });
    }
  </script>
  <script>
    const toggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
  
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light-mode');
        themeIcon.classList.replace('fa-moon', 'fa-sun');
      }
    });
  
    toggleBtn.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-mode');
      themeIcon.classList.toggle('fa-moon', !isLight);
      themeIcon.classList.toggle('fa-sun', isLight);
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  </script>
  
  
  
</body>
</html>
